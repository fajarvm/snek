name: Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set tag output
      id: vars
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
    - name: Check tag output
      env:
        RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
      run: |
        echo $RELEASE_VERSION
        echo ${{ steps.vars.outputs.tag }}
    - name: Verify tag points at main
      if: github.ref_type == 'tag'
      run: |
        git fetch origin main
        # Ensure the tag commit is contained in origin/main
        if ! git merge-base --is-ancestor origin/main $GITHUB_SHA; then
          echo "Tag ${{ steps.vars.outputs.tag }} does not point at main — exiting"
          exit 1
        fi
    - name: Zip Release
      uses: thedoctor0/zip-release@0.7.6
      env:
        RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        ZIP_FILENAME_VERSION: release-${{ steps.vars.outputs.tag }}.zip
      with:
        type: 'zip'
        filename: ${{ env.ZIP_FILENAME_VERSION }}
        exclusions: |
          *.git*
          /*node_modules/*
          /*screenshots/*
        recursive_exclusions: |
          *.git*
          *.y*ml
          *.yaml
    - name: GitHub Release
      uses: softprops/action-gh-release@v3
      env:
        RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        ZIP_FILENAME_VERSION: Snek-${{ steps.vars.outputs.tag }}.zip
      if: github.ref_type == 'tag'
      with:
        draft: false
        name: Snek ${{ env.RELEASE_VERSION }}
        files: ${{ env.ZIP_FILENAME_VERSION }}
